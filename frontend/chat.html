<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat | Lost & Found Portal</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        [data-theme="dark"] body, [data-theme="midnight"] body { background-color: #050811; color: #00f0ff; font-family: 'Inter', sans-serif; }
        [data-theme="basic"] body { background-color: #f8f9fa; color: #212529; font-family: 'Inter', sans-serif; }
        
        .chat-container { max-width: 900px; margin: 40px auto; border-radius: 12px; overflow: hidden; border: 2px solid var(--border-color, #00f0ff); background: var(--card-bg, #0a0f1d); box-shadow: 0 0 25px rgba(0, 240, 255, 0.2); }
        [data-theme="basic"] .chat-container { background: #ffffff; border: 2px solid #dee2e6; color: #212529; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .chat-header { background: var(--header-bg, #000); border-bottom: 1px solid var(--border-color, #00f0ff); padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; }
        [data-theme="basic"] .chat-header { background: #f8f9fa; border-bottom: 1px solid #dee2e6; color: #212529; }
        
        .chat-box { height: 450px; overflow-y: auto; padding: 25px; background: var(--chat-bg, radial-gradient(circle at center, #0d1527 0%, #050811 100%)); }
        [data-theme="basic"] .chat-box { background: #ffffff; }
        
        .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 15px; margin-bottom: 15px; font-size: 0.95rem; }
        .message-sent { background: #00f0ff; color: #000; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; font-weight: 500; }
        [data-theme="basic"] .message-sent { background: #0d6efd; color: #fff; }
        
        .message-received { background: #1a233a; color: #fff; border: 1px solid #39ff14; align-self: flex-start; margin-right: auto; border-bottom-left-radius: 2px; }
        [data-theme="basic"] .message-received { background: #f1f3f5; color: #212529; border: 1px solid #ced4da; }
        
        .chat-input-area { background: var(--header-bg, #000); border-top: 1px solid var(--border-color, #00f0ff); padding: 15px; }
        [data-theme="basic"] .chat-input-area { background: #f8f9fa; border-top: 1px solid #dee2e6; }
    </style>
    <!-- Immediate theme setting to prevent UI flash -->
    <script>
        const savedTheme = localStorage.getItem("portal_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-cyan">
        <div class="container">
            <a class="navbar-brand fw-bold text-cyan" href="index.html">
                <i class="bi bi-shield-check text-cyan me-2"></i> LOST & FOUND
            </a>
            <div class="d-flex align-items-center">
                <a href="search.html" class="btn btn-outline-info btn-sm me-2"><i class="bi bi-search me-1"></i> Search Items</a>
                <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <!-- CHAT CONTAINER -->
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h5 class="mb-0 text-cyan fw-bold" id="itemTitleHeader"><i class="bi bi-chat-lock-fill text-warning me-2"></i> Anonymous Secure Chat</h5>
                    <small class="text-muted" id="chatSubHeader">Encrypted P2P messaging session</small>
                </div>
                <span class="badge bg-success"><i class="bi bi-circle-fill me-1" style="font-size:0.6rem;"></i> Connected</span>
            </div>

            <div class="chat-box d-flex flex-column" id="chatMessages">
                <div class="text-center my-auto text-muted">
                    <i class="bi bi-shield-lock fs-1 text-cyan opacity-50"></i>
                    <p class="mt-2">Start typing to communicate securely without sharing personal contact numbers.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chatForm" class="d-flex gap-2">
                    <input type="text" id="messageInput" class="form-control bg-dark text-cyan border-cyan" placeholder="Type your message..." required autocomplete="off">
                    <button type="submit" class="btn btn-cyan px-4 fw-bold" style="background:#00f0ff; color:#000;">
                        <i class="bi bi-send-fill me-1"></i> Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/main.js"></script>
    <script src="js/chat.js"></script>

</body>

</html>
