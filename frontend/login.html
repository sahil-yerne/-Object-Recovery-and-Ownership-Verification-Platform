<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Lost & Found Portal</title>

    <meta name="description" content="Login to your Lost & Found Portal account to track and report items.">

    <meta name="author" content="Sahil Yerne">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="assets/logo/favicon.png">

    <!-- Theme Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('portal_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            border-radius: 16px !important;
            padding: 2.2rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        .auth-card .form-control {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .auth-card .btn-auth {
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 10;
            color: #00f3ff !important;
            font-size: 1.2rem;
            opacity: 0.85;
            transition: all 0.2s ease;
        }
        .password-toggle:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.15);
            color: #ffffff !important;
        }
        .auth-secondary-card {
            width: 100%;
            max-width: 440px;
            border-radius: 14px !important;
            padding: 1.2rem;
            text-align: center;
            margin-top: 1rem;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 6px;
        }
        #alertBox {
            display: none;
            border-radius: 10px;
        }
        .form-switch-anim {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .hidden-form {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ================= INSTAGRAM / AMAZON STYLE AUTH CONTAINER ================= -->
    <div class="auth-wrapper">

        <!-- Logo Brand Header -->
        <a href="index.html" class="auth-brand navbar-brand">
            <img src="assets/logo/logo.png" alt="Logo" class="rounded-circle me-1" style="height: 42px; width: 42px; object-fit: cover; background: white; padding: 2px;">
            Lost & Found
        </a>

        <!-- Alert Box -->
        <div style="width: 100%; max-width: 440px;">
            <div id="alertBox" class="alert alert-dismissible fade show mb-3" role="alert">
                <span id="alertMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- Main Card -->
        <div class="card auth-card border-0">

            <!-- ================= LOGIN FORM VIEW ================= -->
            <div id="loginFormView" class="form-switch-anim">

                <h3 class="fw-bold mb-1 text-center">Log In</h3>
                <p class="text-muted text-center small mb-4">Enter your credentials to access your account</p>

                <form id="loginForm" novalidate>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email address</label>
                        <input type="email" id="email" class="form-control" placeholder="Name@example.com" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-semibold small mb-1">Password</label>
                            <a href="#" class="small text-decoration-none text-muted">Forgot password?</a>
                        </div>
                        <div class="position-relative">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            <i class="bi bi-eye-slash-fill password-toggle" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="form-check mb-4 mt-2">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">
                            Keep me logged in
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-auth w-100 mb-3" id="submitBtn">
                        Log In
                    </button>

                </form>

            </div>

            <!-- ================= SIGNUP FORM VIEW ================= -->
            <div id="signupFormView" class="form-switch-anim hidden-form">

                <h3 class="fw-bold mb-1 text-center">Create Account</h3>
                <p class="text-muted text-center small mb-4">Sign up to report items and connect with finders</p>

                <form id="signupForm" novalidate>

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" id="signup_name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email address</label>
                        <input type="email" id="signup_email" class="form-control" placeholder="Name@example.com" required>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Phone Number <span class="text-muted fw-normal">(Optional)</span></label>
                        <input type="tel" id="signup_phone" class="form-control" placeholder="+91 9876543210">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password</label>
                        <div class="position-relative">
                            <input type="password" id="signup_password" class="form-control" placeholder="Create a password" required minlength="6">
                            <i class="bi bi-eye-slash-fill password-toggle" id="toggleSignupPassword"></i>
                        </div>
                        <div class="strength-bar" id="strengthBar"></div>
                        <small class="text-muted" id="strengthText"></small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Confirm Password</label>
                        <div class="position-relative">
                            <input type="password" id="signup_confirmPassword" class="form-control" placeholder="Re-enter password" required>
                            <i class="bi bi-eye-slash-fill password-toggle" id="toggleSignupConfirmPassword"></i>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-auth w-100 mb-2" id="signupSubmitBtn">
                        Sign Up
                    </button>

                </form>

            </div>

        </div>

        <!-- Secondary Card (Instagram/Amazon style bottom switch box) -->
        <div class="card auth-secondary-card border-0">
            <span id="switchText" class="small">
                Don't have an account? 
                <a href="#" id="switchToSignupBtn" class="fw-bold text-primary text-decoration-none ms-1">Sign up</a>
            </span>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

    <!-- Seamless Switch Script -->
    <script>
        const loginView = document.getElementById('loginFormView');
        const signupView = document.getElementById('signupFormView');
        const switchBtn = document.getElementById('switchToSignupBtn');
        const switchText = document.getElementById('switchText');

        let isSignup = false;

        function showSignup() {
            isSignup = true;
            loginView.classList.add('hidden-form');
            signupView.classList.remove('hidden-form');
            switchText.innerHTML = 'Have an account? <a href="#" id="switchToLoginBtn" class="fw-bold text-primary text-decoration-none ms-1">Log in</a>';
            document.getElementById('switchToLoginBtn').addEventListener('click', (e) => {
                e.preventDefault();
                showLogin();
            });
        }

        function showLogin() {
            isSignup = false;
            signupView.classList.add('hidden-form');
            loginView.classList.remove('hidden-form');
            switchText.innerHTML = 'New to Lost & Found? <a href="#" id="switchToSignupBtn" class="fw-bold text-primary text-decoration-none ms-1">Sign up</a>';
            document.getElementById('switchToSignupBtn').addEventListener('click', (e) => {
                e.preventDefault();
                showSignup();
            });
        }

        switchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            showSignup();
        });

        // Handle URL ?tab=signup
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'signup') {
            showSignup();
        }
    </script>

</body>

</html>
