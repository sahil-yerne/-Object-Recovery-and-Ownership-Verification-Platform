<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Success | Lost & Found Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts (Rajdhani) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="assets/logo/favicon.png">

    <!-- Theme Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('portal_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

</head>

<body>

    <!-- ================= SUCCESS SECTION ================= -->

    <section class="d-flex align-items-center justify-content-center vh-100">

        <div class="text-center">

            <div class="mb-4">

                <i class="bi bi-check-circle-fill text-success" style="font-size: 80px;"></i>

            </div>

            <h1 class="fw-bold text-success">

                Success!

            </h1>

            <p class="lead text-muted">

                Your item has been submitted successfully.

            </p>

            <p class="text-muted">

                We will notify you if there is any update regarding your report.

            </p>

            <div class="mt-4">

                <a href="index.html" class="btn btn-primary btn-lg">

                    <i class="bi bi-house-door-fill"></i> Go to Home

                </a>

                <a href="search.html" class="btn btn-outline-secondary btn-lg ms-2">

                    <i class="bi bi-search"></i> Search Items

                </a>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
